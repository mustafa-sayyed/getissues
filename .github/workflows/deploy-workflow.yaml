name: Deploy workflows using serverless framework

on:
  push:
    branches:
      - main
    paths:
      - "apps/workflows/**"

  pull_request:
    branches:
      - main
    paths:
      - "apps/workflows/**"

  workflow_dispatch:

env:
  NODE_ENV: production
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GITHUB_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
  VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  COGNEE_API_KEY: ${{ secrets.COGNEE_API_KEY }}
  COGNEE_BASE_URL: ${{ secrets.COGNEE_BASE_URL }}
  COGNEE_ENABLED: true
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  OTEL_SERVICE_NAME: ${{ secrets.OTEL_SERVICE_NAME }}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
  INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
  INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
  INNGEST_DEV: 0



jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Built local packages
        run: |
          pnpm --filter=@packages/db build
          pnpm --filter=@packages/shared build

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy workflow
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}          
        run: |
          cd apps/workflows
          npx serverless deploy --stage production
